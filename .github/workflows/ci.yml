name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm test

  # The Flutter app and the Dart engine: the Dart engine must replay the TypeScript engine's shared test games.
  app:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.47.9, channel: stable, cache: true }
      - name: Dart engine (parity with packages/engine)
        working-directory: packages/engine_dart
        run: dart pub get && dart analyze --fatal-infos && dart test
      - name: Analyze and widget tests
        working-directory: app
        run: flutter pub get && flutter analyze && flutter test
      - name: Signing key (the upload key, so every APK has the same SHA-1)
        env: { KEY_B64: '${{ secrets.ANDROID_KEYSTORE_B64 }}' }
        run: |
          if [ -n "$KEY_B64" ]; then echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"; echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"; fi
      - name: Firebase config (push; without the secret the APK builds with push off)
        env: { GOOGLE_SERVICES_JSON: '${{ secrets.GOOGLE_SERVICES_JSON }}' }
        run: if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > app/android/app/google-services.json; fi
      - name: Debug APK
        working-directory: app
        run: |
          v=$(grep -E '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)
          flutter build apk --debug --build-number=${{ github.run_number }} --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"             --dart-define=VERSION="$v" --dart-define=BUILD=${{ github.run_number }}
      - name: Name the APK (version and build number)
        id: apk
        run: |
          v=$(grep -E '^version:' app/pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1)  # 0.1.0+1 -> 0.1.0
          n="MafiaDealer-PartyGame-$v-b${{ github.run_number }}-debug.apk"
          cp app/build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/$n"
          echo "file=$RUNNER_TEMP/$n" >> "$GITHUB_OUTPUT"; echo "name=${n%.apk}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with: { name: '${{ steps.apk.outputs.name }}', path: '${{ steps.apk.outputs.file }}', retention-days: 14 }

  # On a real Android emulator: a whole offline game, Back and a cold start; accounts and friends against a local
  # Worker (wrangler dev on the runner, reached from the emulator as 10.0.2.2; codes readable in local test mode).
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Local Worker for the account tests
        working-directory: server
        env: { WRANGLER_SEND_METRICS: 'false' }
        run: |
          npx wrangler d1 migrations apply DB --local
          # a scripted Wi-Fi game lasts seconds: the local copy of the approval rules allows short games (approval_test)
          npx wrangler d1 execute DB --local --command "UPDATE settings SET value = json_set(value, '\$.minSecondsPerRound', 0) WHERE key = 'wifi_rules'"
          nohup npx wrangler dev --port 8787 --ip 0.0.0.0 --var MAIL_LOG:1 > "$RUNNER_TEMP/worker.log" 2>&1 &
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:8787/v1/health
      - name: Signing key (the upload key, so every APK has the same SHA-1)
        env: { KEY_B64: '${{ secrets.ANDROID_KEYSTORE_B64 }}' }
        run: |
          if [ -n "$KEY_B64" ]; then echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"; echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"; fi
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.47.9, channel: stable, cache: true }
      - run: flutter pub get
        working-directory: app
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: app
          script: flutter test integration_test --dart-define=API_BASE=http://10.0.2.2:8787
      - if: always()
        run: tail -n 60 "$RUNNER_TEMP/worker.log" || true

  # main only: apply D1 migrations, then deploy the Worker. Skipped until the Cloudflare secrets and the D1 id are set.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      ADMIN_IDS: ${{ secrets.ADMIN_IDS }}
      FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
    defaults:
      run: { working-directory: server }
    steps:
      - uses: actions/checkout@v7
      - id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || grep -q '"database_id": "00000000-' wrangler.jsonc; then
            echo "Not set up yet: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets or the D1 database_id. Skipping the deploy."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - if: steps.ready.outputs.go == 'true'
        run: npm ci
        working-directory: .
      - if: steps.ready.outputs.go == 'true'
        run: npx wrangler d1 migrations apply DB --remote
      - if: steps.ready.outputs.go == 'true'
        run: npx wrangler deploy
      - if: steps.ready.outputs.go == 'true' && env.RESEND_API_KEY != ''
        run: echo "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
      - if: steps.ready.outputs.go == 'true' && env.ADMIN_IDS != ''
        run: echo "$ADMIN_IDS" | npx wrangler secret put ADMIN_IDS
      - if: steps.ready.outputs.go == 'true' && env.FCM_SERVICE_ACCOUNT != ''
        run: printf '%s' "$FCM_SERVICE_ACCOUNT" | npx wrangler secret put FCM_SERVICE_ACCOUNT
      - if: steps.ready.outputs.go == 'true'
        # a new deploy takes a few seconds to reach every Cloudflare location
        run: curl -fsS --retry 6 --retry-delay 5 --retry-all-errors "https://mafia-dealer-game.mafiadealer.workers.dev/v1/health"
