name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm test

  # The Flutter app and the Dart engine: the Dart engine must replay the TypeScript engine's shared test games.
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.47.9, channel: stable, cache: true }
      - name: Dart engine (parity with packages/engine)
        working-directory: packages/engine_dart
        run: dart pub get && dart analyze --fatal-infos && dart test
      - name: Analyze and widget tests
        working-directory: app
        run: flutter pub get && flutter analyze && flutter test
      - name: Debug APK
        working-directory: app
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v7
        with: { name: mafia-dealer-debug-apk, path: app/build/app/outputs/flutter-apk/app-debug.apk, retention-days: 14 }

  # A whole offline game, Back and kill-and-resume on a real Android emulator.
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21 }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.47.9, channel: stable, cache: true }
      - run: flutter pub get
        working-directory: app
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          working-directory: app
          script: flutter test integration_test

  # main only: apply D1 migrations, then deploy the Worker. Skipped until the Cloudflare secrets and the D1 id are set.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    defaults:
      run: { working-directory: server }
    steps:
      - uses: actions/checkout@v7
      - id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || grep -q '"database_id": "00000000-' wrangler.jsonc; then
            echo "Not set up yet: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets or the D1 database_id. Skipping the deploy."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - if: steps.ready.outputs.go == 'true'
        run: npm ci
        working-directory: .
      - if: steps.ready.outputs.go == 'true'
        run: npx wrangler d1 migrations apply DB --remote
      - if: steps.ready.outputs.go == 'true'
        run: npx wrangler deploy
      - if: steps.ready.outputs.go == 'true' && env.RESEND_API_KEY != ''
        run: echo "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
      - if: steps.ready.outputs.go == 'true'
        # a new deploy takes a few seconds to reach every Cloudflare location
        run: curl -fsS --retry 6 --retry-delay 5 --retry-all-errors "https://mafia-dealer-game.mafiadealer.workers.dev/v1/health"
