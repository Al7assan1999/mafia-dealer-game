name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm test

  # main only: apply D1 migrations, then deploy the Worker. Skipped until the Cloudflare secrets and the D1 id are set.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
    defaults:
      run: { working-directory: server }
    steps:
      - uses: actions/checkout@v7
      - id: ready
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || grep -q '"database_id": "00000000-' wrangler.jsonc; then
            echo "Not set up yet: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets or the D1 database_id. Skipping the deploy."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.ready.outputs.go == 'true'
        uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - if: steps.ready.outputs.go == 'true'
        run: npm ci
        working-directory: .
      - if: steps.ready.outputs.go == 'true'
        run: npx wrangler d1 migrations apply DB --remote
      - if: steps.ready.outputs.go == 'true'
        run: npx wrangler deploy
      - if: steps.ready.outputs.go == 'true' && env.RESEND_API_KEY != ''
        run: echo "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY
      - if: steps.ready.outputs.go == 'true'
        run: curl -fsS "https://mafia-dealer-game.mafiadealer.workers.dev/v1/health"
