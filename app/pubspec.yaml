name: mafia_dealer
description: "Mafia Dealer: Party Game. The Mafia party game on one phone, over Wi-Fi or online."
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ^3.13.7

dependencies:
  audioplayers: ^6.8.1
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  http: ^1.6.0
  image: ^4.13.1
  image_picker: ^1.2.4
  intl: ^0.20.3
  mafia_engine:
    path: ../packages/engine_dart
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/voice/
    - assets/sfx/
    - assets/fonts/
  fonts:
    - family: Plex
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: Elite
      fonts:
        - asset: assets/fonts/SpecialElite-Regular.ttf
    - family: Messiri
      fonts:
        - asset: assets/fonts/ElMessiri-Variable.ttf
    - family: Readex
      fonts:
        - asset: assets/fonts/ReadexPro-Variable.ttf
